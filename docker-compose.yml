services:
  postgres:
    image: postgres:latest
    container_name: my-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: princepal
      POSTGRES_DB: url_shortener  
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - pg-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: my-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: princepal262501@gmail.com
      PGADMIN_DEFAULT_PASSWORD: princepal
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pg-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  pg-net:

volumes:
  pgdata:
  pgadmin_data: